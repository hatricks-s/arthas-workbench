name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Prototype / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WORKBENCH_LONG_TESTS: '1'
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_LINK_MODE: copy
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/connector
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Set up Node for syntax checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install uv and dependencies
        run: |
          python -m pip install uv==0.6.9
          uv sync --locked --python 3.13
      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup override set 1.94.1
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path connector/Cargo.toml
      - name: Build connector
        run: cargo build --locked --manifest-path connector/Cargo.toml
      - name: Run Rust unit tests
        run: cargo test --locked --bin arthas-connector --manifest-path connector/Cargo.toml
      - name: Run native process fixtures on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --features test-fixtures --manifest-path connector/Cargo.toml
      - name: Run gateway and connector integration tests
        run: uv run --no-sync python -B -m unittest discover -s tests -v
      - name: Verify static preview matches the application UI
        run: |
          uv run --no-sync python -B scripts/build_preview.py
          git diff --exit-code -- docs/preview
          node --check workbench/static/app.js
          node --check docs/preview/mock.js
          node --check docs/preview/app.js
          node scripts/check_preview.mjs
