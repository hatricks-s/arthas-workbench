[project]
name = "arthas-workbench-prototype"
version = "0.1.0"
description = "Dual-path Arthas Web and Streamable HTTP prototype"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arthas Workbench contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastmcp==2.11.3",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "starlette==0.47.2",
  "uvicorn==0.35.0",
  "websockets==15.0.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
]

[project.urls]
Homepage = "https://github.com/hatricks-s/arthas-workbench"
Repository = "https://github.com/hatricks-s/arthas-workbench"
Issues = "https://github.com/hatricks-s/arthas-workbench/issues"

[project.scripts]
arthas-workbench = "workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbench"]
